<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>BUG HUNTER — 基礎プログラミングII 前期試験対策</title>

<meta name="theme-color" content="#1a1c2c">
<meta property="og:title" content="BUG HUNTER — 基礎プログラミングII 前期試験対策">
<meta property="og:description" content="バグ発見とタイムアタックで、前期の範囲をまるごと復習する。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231a1c2c'/%3E%3Crect x='7' y='2' width='2' height='12' fill='%23ffcd75'/%3E%3Crect x='2' y='7' width='12' height='2' fill='%23ffcd75'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%23ef7d57'/%3E%3Crect x='7' y='7' width='2' height='2' fill='%23a7f070'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════
   Sweetie 16 派生パレット
   ═══════════════════════════════════════════ */
:root{
  --void:#1a1c2c;      /* 背景（濃紺） */
  --deep:#12141f;      /* コードパネル */
  --steel:#29366f;     /* パネル面 */
  --slate:#566c86;     /* 補助テキスト */
  --sky:#41a6f6;       /* 情報 */
  --lime:#a7f070;      /* 正解 */
  --green:#38b764;
  --gold:#ffcd75;      /* 主役アクセント */
  --coral:#ef7d57;     /* 警告 */
  --blood:#b13e53;     /* ミス */
  --bone:#f4f4f4;

  --px:4px;
  --ui:"DotGothic16","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}

html{height:100%}
body{
  min-height:100%;
  background:var(--void);
  color:var(--bone);
  font-family:var(--ui);
  font-size:16px;
  line-height:1.7;
  image-rendering:pixelated;
  overflow-x:hidden;
}

/* 走査線オーバーレイ */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(
    to bottom,transparent 0 3px,rgba(0,0,0,.16) 3px 4px);
  mix-blend-mode:multiply;
}

/* 背景のドットグリッド */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(var(--steel) 1px,transparent 1px);
  background-size:24px 24px;opacity:.35;
}

.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:32px 20px 80px}

/* ═══ 共通パーツ ═══ */
.panel{
  background:var(--steel);
  box-shadow:0 0 0 var(--px) var(--void),0 0 0 calc(var(--px)*2) var(--slate);
  padding:20px;
}

.btn{
  display:inline-block;font-family:var(--ui);font-size:15px;
  background:var(--gold);color:var(--void);
  border:0;padding:12px 22px;cursor:pointer;
  box-shadow:0 0 0 var(--px) var(--void),0 var(--px) 0 var(--px) var(--coral);
  transition:transform .06s steps(2),box-shadow .06s steps(2);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 var(--px) var(--void),0 6px 0 var(--px) var(--coral)}
.btn:active{transform:translateY(var(--px));box-shadow:0 0 0 var(--px) var(--void)}
.btn:focus-visible{outline:var(--px) solid var(--sky);outline-offset:6px}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:0 0 0 var(--px) var(--gold)}
.btn.ghost:hover{background:var(--gold);color:var(--void)}

.eyebrow{
  font-size:12px;letter-spacing:.22em;color:var(--gold);
  text-transform:uppercase;margin-bottom:8px;
}

.hidden{display:none !important}

/* ═══ タイトル ═══ */
.title-screen{text-align:center;padding:48px 0 24px}
.logo{
  font-size:clamp(38px,8vw,76px);line-height:1;letter-spacing:.04em;
  color:var(--gold);
  text-shadow:
    var(--px) var(--px) 0 var(--blood),
    calc(var(--px)*2) calc(var(--px)*2) 0 var(--void);
  margin-bottom:6px;
}
.logo .glyph{color:var(--lime);display:inline-block;animation:hop 1.1s steps(2) infinite}
@keyframes hop{0%,60%{transform:translateY(0)}80%{transform:translateY(-8px)}}
.sub{color:var(--slate);font-size:14px;letter-spacing:.12em;margin-bottom:36px}

.mode-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));text-align:left}
.mode-card{
  background:var(--steel);cursor:pointer;padding:24px;border:0;
  color:var(--bone);font-family:var(--ui);text-align:left;
  box-shadow:0 0 0 var(--px) var(--void),0 0 0 calc(var(--px)*2) var(--slate);
  transition:box-shadow .1s steps(2),transform .1s steps(2);
}
.mode-card:hover,.mode-card:focus-visible{
  outline:none;transform:translateY(-4px);
  box-shadow:0 0 0 var(--px) var(--void),0 0 0 calc(var(--px)*2) var(--gold);
}
.mode-card h2{font-size:24px;color:var(--gold);margin-bottom:8px;font-weight:400}
.mode-card p{font-size:14px;color:var(--bone);opacity:.85;margin-bottom:14px}
.mode-card .meta{font-size:12px;color:var(--sky);letter-spacing:.1em}
.mode-icon{font-size:32px;line-height:1;margin-bottom:12px;display:block}

.best-line{margin-top:28px;font-size:13px;color:var(--slate);letter-spacing:.08em}
.best-line b{color:var(--gold);font-weight:400}

/* ═══ HUD ═══ */
.hud{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  flex-wrap:wrap;margin-bottom:20px;padding:12px 16px;
  background:var(--deep);
  box-shadow:0 0 0 var(--px) var(--slate);
}
.hud-item{font-size:13px;letter-spacing:.1em;color:var(--slate)}
.hud-item b{display:block;font-size:22px;color:var(--gold);font-weight:400;line-height:1.2}
.hud-item.danger b{color:var(--coral)}

/* HPブロック */
.hp{display:flex;gap:4px;margin-top:4px}
.hp span{width:18px;height:18px;background:var(--lime);box-shadow:0 0 0 2px var(--void)}
.hp span.lost{background:var(--deep);box-shadow:0 0 0 2px var(--slate)}

/* タイマーバー */
.timer-track{width:160px;height:14px;background:var(--deep);box-shadow:0 0 0 2px var(--slate);margin-top:6px}
.timer-fill{height:100%;background:var(--sky);width:100%;transition:width .25s linear}
.timer-fill.warn{background:var(--gold)}
.timer-fill.crit{background:var(--coral);animation:blink .4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

/* ═══ コードパネル（署名要素） ═══ */
.stage{position:relative}
.stage.shake{animation:shake .3s steps(3)}
@keyframes shake{
  0%{transform:translate(0)}25%{transform:translate(-8px,3px)}
  50%{transform:translate(7px,-3px)}75%{transform:translate(-4px,2px)}100%{transform:translate(0)}
}

.prompt{
  font-size:15px;margin-bottom:14px;color:var(--bone);
  padding-left:14px;border-left:var(--px) solid var(--gold);
}

.code{
  background:var(--deep);padding:18px 0;
  box-shadow:0 0 0 var(--px) var(--slate);
  font-family:var(--mono);font-size:14.5px;line-height:1.9;
  overflow-x:auto;
}
.line{
  display:flex;align-items:baseline;gap:14px;
  padding:1px 18px;white-space:pre;
  border-left:var(--px) solid transparent;
}
.line .no{color:var(--slate);min-width:22px;text-align:right;user-select:none;font-size:12px}
.line .src{flex:1}

.line.target{cursor:crosshair}
.line.target:hover,.line.target:focus-visible{
  outline:none;
  background:linear-gradient(90deg,rgba(255,205,117,.18),transparent);
  border-left-color:var(--gold);
}
.line.target:hover .no,.line.target:focus-visible .no{color:var(--gold)}
.line.target:hover .src::after{content:" ◀";color:var(--gold)}

.line.hit{background:rgba(167,240,112,.16);border-left-color:var(--lime)}
.line.hit .no{color:var(--lime)}
.line.miss{background:rgba(177,62,83,.28);border-left-color:var(--blood)}
.line.reveal{background:rgba(167,240,112,.16);border-left-color:var(--lime)}

/* ═══ 判定ふきだし ═══ */
.verdict{margin-top:18px;padding:18px;box-shadow:0 0 0 var(--px) var(--slate);background:var(--steel)}
.verdict.good{box-shadow:0 0 0 var(--px) var(--lime)}
.verdict.bad{box-shadow:0 0 0 var(--px) var(--coral)}
.verdict h3{font-size:19px;font-weight:400;margin-bottom:10px}
.verdict.good h3{color:var(--lime)}
.verdict.bad h3{color:var(--coral)}
.verdict dl{font-size:14px}
.verdict dt{color:var(--gold);font-size:12px;letter-spacing:.14em;margin-top:12px}
.verdict dt:first-child{margin-top:0}
.verdict dd{margin-top:2px;line-height:1.75}
.verdict code{
  font-family:var(--mono);font-size:13.5px;background:var(--deep);
  padding:2px 6px;color:var(--lime);
}
.verdict pre{
  font-family:var(--mono);font-size:13.5px;background:var(--deep);
  padding:12px 14px;margin-top:6px;overflow-x:auto;color:var(--lime);line-height:1.7;
}
.verdict .next{margin-top:18px}

/* ═══ タイムアタック ═══ */
.q-text{font-size:18px;line-height:1.75;margin-bottom:20px}
.q-text .codeblock{
  display:block;font-family:var(--mono);font-size:14px;background:var(--deep);
  padding:12px 14px;margin-top:12px;color:var(--sky);white-space:pre-wrap;line-height:1.7;
}
.choices{display:grid;gap:10px}
.choice{
  text-align:left;font-family:var(--ui);font-size:15px;line-height:1.6;
  background:var(--deep);color:var(--bone);border:0;padding:14px 16px;cursor:pointer;
  box-shadow:0 0 0 2px var(--slate);
  display:flex;gap:12px;align-items:flex-start;
}
.choice .key{color:var(--gold);flex-shrink:0;font-size:13px}
.choice .txt{font-family:var(--mono);font-size:13.5px;word-break:break-word}
.choice.plain .txt{font-family:var(--ui);font-size:15px}
.choice:hover:not(:disabled){box-shadow:0 0 0 2px var(--gold);background:#1c2140}
.choice:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
.choice:disabled{cursor:default}
.choice.right{box-shadow:0 0 0 2px var(--lime);background:rgba(167,240,112,.14)}
.choice.wrong{box-shadow:0 0 0 2px var(--blood);background:rgba(177,62,83,.22)}

.combo{
  position:fixed;right:28px;top:50%;transform:translateY(-50%);
  font-size:44px;color:var(--gold);z-index:50;pointer-events:none;
  text-shadow:var(--px) var(--px) 0 var(--blood);opacity:0;
}
.combo.pop{animation:pop .5s steps(4)}
@keyframes pop{
  0%{opacity:0;transform:translateY(-50%) scale(.5)}
  40%{opacity:1;transform:translateY(-50%) scale(1.15)}
  100%{opacity:0;transform:translateY(-50%) scale(1)}
}

/* ═══ リザルト ═══ */
.result{text-align:center;padding:28px 20px}
.rank{
  font-size:110px;line-height:1;color:var(--gold);
  text-shadow:var(--px) var(--px) 0 var(--blood),calc(var(--px)*2) calc(var(--px)*2) 0 var(--void);
  margin-bottom:4px;
}
.rank.s{color:var(--lime)}
.rank.c{color:var(--coral)}
.result .score{font-size:42px;color:var(--bone);margin-bottom:6px}
.result .newbest{color:var(--lime);font-size:14px;letter-spacing:.16em;animation:blink .7s steps(2) infinite}
.stats{
  display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  margin:28px 0;text-align:left;
}
.stat{background:var(--deep);padding:12px 14px;box-shadow:0 0 0 2px var(--slate)}
.stat span{display:block;font-size:11px;color:var(--slate);letter-spacing:.12em}
.stat b{font-size:24px;color:var(--gold);font-weight:400}

.weak{text-align:left;margin-top:8px;padding:18px;background:var(--steel);box-shadow:0 0 0 var(--px) var(--coral)}
.weak h3{font-size:16px;color:var(--coral);font-weight:400;margin-bottom:10px}
.weak li{list-style:none;font-size:14px;padding:5px 0 5px 20px;position:relative}
.weak li::before{content:"▸";position:absolute;left:0;color:var(--coral)}
.weak .tip{font-size:13px;color:var(--slate);margin-top:12px;line-height:1.7}

.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px}

.foot{margin-top:40px;font-size:12px;color:var(--slate);text-align:center;line-height:1.9}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
@media(max-width:600px){
  .wrap{padding:20px 14px 60px}
  .code{font-size:12.5px}
  .combo{right:12px;font-size:32px}
}
</style>
</head>

<body>

<script>
/* ═══════════════════════════════════════════
   バグハンター問題（clickする行＝bug）
   ═══════════════════════════════════════════ */
const HUNT = [
{topic:"構造体",why:"name は char[50] という<b>配列</b>。= で文字列をまるごと代入できない。配列名はアドレスを表すだけで、代入先にはならない。",
 fix:'#include <string.h>\nstrcpy(s.name, "神山四角子");',
 bug:9,lines:[
 '#include <stdio.h>','','typedef struct {','    char name[50];','    int  score;','} Student;','',
 'int main(void) {','    Student s;','    s.name = "神山四角子";','    s.score = 90;',
 '    printf("%s: %d点\\n", s.name, s.score);','    return 0;','}']},

{topic:"構造体",why:"hero は<b>ポインタではなく普通の構造体変数</b>。-> はポインタ専用の演算子なので使えない。",
 fix:'hero.hp = 100;',
 bug:1,lines:['struct character hero;','hero->hp = 100;']},

{topic:"構造体",why:"p は<b>ポインタ</b>なので . ではなく -> を使う。(*p).hp と書いてもよい。",
 fix:'printf("%d\\n", p->hp);',
 bug:2,lines:['Character hero = {"勇者", 40};','Character *p = &hero;','printf("%d\\n", p.hp);']},

{topic:"構造体",why:"構造体の初期化は<b>定義した順番通り</b>に並べる。定義は name → hp → attack なのに、1番目に数値を渡している。",
 fix:'Character boss = {"ラスボス", 999, 77};',
 bug:1,lines:['/* typedef struct { char name[16]; int hp; int attack; } Character; */',
 'Character boss = {999, "ラスボス", 77};']},

{topic:"構造体",why:"strcpy は <string.h> で宣言されている。インクルードしないと宣言が見つからず警告・エラーになる。",
 fix:'#include <string.h>   /* stdlib.h ではなく string.h */',
 bug:1,lines:['#include <stdio.h>','#include <stdlib.h>','','typedef struct { char name[16]; } Character;','',
 'int main(void) {','    Character c;','    strcpy(c.name, "勇者");','    return 0;','}']},

{topic:"動的メモリ",why:"malloc は失敗すると <b>NULL を返す</b>。NULL チェックなしでこの行を実行するとクラッシュする。",
 fix:'int *arr = malloc(n * sizeof(int));\nif (arr == NULL) { return 1; }\narr[0] = 100;',
 bug:2,lines:['int n = 10;','int *arr = malloc(n * sizeof(int));','arr[0] = 100;','free(arr);']},

{topic:"動的メモリ",why:"int を n 個分には <b>n * sizeof(int)</b> バイト（通常40バイト）必要。10バイトしか確保していないので arr[9] は範囲外アクセス。",
 fix:'int *arr = malloc(n * sizeof(int));',
 bug:1,lines:['int n = 10;','int *arr = malloc(n);','if (arr == NULL) { return 1; }','arr[9] = 100;','free(arr);']},

{topic:"動的メモリ",why:"すでに解放した領域をもう一度解放する<b>二重 free</b>。クラッシュの原因になる。",
 fix:'free(data);\ndata = NULL;   /* free(NULL) は無害なので事故を防げる */',
 bug:3,lines:['int *data = malloc(5 * sizeof(int));','if (data == NULL) { return 1; }','free(data);','free(data);']},

{topic:"動的メモリ",why:"解放済みの領域はもう自分のものではない（<b>ダングリングポインタ</b>）。読んだ値は保証されず、動いて見えても危険。",
 fix:'printf("%d\\n", data[0]);   /* 使うのは free の前 */\nfree(data);\ndata = NULL;',
 bug:3,lines:['int *data = malloc(5 * sizeof(int));','data[0] = 42;','free(data);','printf("%d\\n", data[0]);']},

{topic:"動的メモリ",why:"realloc は失敗すると NULL を返すが、<b>元の領域はまだ生きている</b>。元のポインタに直接代入するとアドレスを失い、free できなくなる（メモリリーク）。",
 fix:'int *tmp = realloc(arr, 10 * sizeof(int));\nif (tmp == NULL) { free(arr); return 1; }\narr = tmp;',

/* ═══════════════════════════════════════════
   状態・ユーティリティ
   ═══════════════════════════════════════════ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle = a => { const r=[...a]; for(let i=r.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[r[i],r[j]]=[r[j],r[i]];} return r; };

let best = { hunt:0, time:0 };
let mode = null, S = {};

const KEY = "bughunter-best";

/* 保存先は環境で変わる：
   ・GitHub Pages などの通常のブラウザ → localStorage
   ・Claude のプレビュー内             → window.storage
   どちらも使えないときは、そのセッション中だけ記録が残る。 */
async function loadBest(){
  try{
    const v = localStorage.getItem(KEY);
    if(v){ best = Object.assign(best, JSON.parse(v)); paintBest(); return; }
  }catch(e){}
  try{
    const r = await window.storage.get(KEY);
    if(r && r.value) best = Object.assign(best, JSON.parse(r.value));
  }catch(e){}
  paintBest();
}

async function saveBest(){
  try{ localStorage.setItem(KEY, JSON.stringify(best)); return; }catch(e){}
  try{ await window.storage.set(KEY, JSON.stringify(best)); }catch(e){}
}
function paintBest(){
  $("#best-line").innerHTML =
    `ハイスコア　バグハンター <b>${best.hunt}</b>　／　タイムアタック <b>${best.time}</b>`;
}

function show(id){
  ["#s-title","#s-hunt","#s-time","#s-result"].forEach(s=>$(s).classList.add("hidden"));
  $(id).classList.remove("hidden");
  window.scrollTo({top:0});
}


/* ═══════════════════════════════════════════
   バグハンター
   ═══════════════════════════════════════════ */
function startHunt(){
  mode = "hunt";
  S = { list:shuffle(HUNT), i:0, score:0, hp:3, cleared:0, wrongTopics:{} , locked:false};
  show("#s-hunt");
  drawHunt();
}

function drawHunt(){
  const p = S.list[S.i];
  S.locked = false;
  $("#h-stage").textContent = `${S.i+1} / ${S.list.length}`;
  $("#h-score").textContent = S.score;
  $("#h-topic").textContent = p.topic;
  $("#h-prompt").textContent = "壊れている行をクリックしてください。";
  $("#h-verdict").innerHTML = "";

  $("#h-code").innerHTML = p.lines.map((src,idx)=>{
    const blank = src.trim()==="";
    return `<div class="line${blank?"":" target"}" ${blank?"":`role="button" tabindex="0" data-i="${idx}"`}>
      <span class="no">${idx+1}</span><span class="src">${esc(src)||" "}</span></div>`;
  }).join("");

  $$("#h-code .line.target").forEach(el=>{
    el.addEventListener("click",()=>pick(+el.dataset.i));
    el.addEventListener("keydown",ev=>{
      if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); pick(+el.dataset.i); }
    });
  });
  paintHP();
}

function paintHP(){
  $("#h-hp").innerHTML = [0,1,2].map(i=>`<span class="${i<S.hp?"":"lost"}"></span>`).join("");
}

function pick(idx){
  if(S.locked) return;
  S.locked = true;
  const p = S.list[S.i];
  const ok = idx === p.bug;
  const lines = $$("#h-code .line");

  $$("#h-code .line.target").forEach(el=>{ el.classList.remove("target"); el.removeAttribute("tabindex"); });

  if(ok){
    lines[idx].classList.add("hit");
    S.score += 100 + S.hp*20;
    S.cleared++;
  }else{
    lines[idx].classList.add("miss");
    lines[p.bug].classList.add("reveal");
    S.hp--;
    S.wrongTopics[p.topic] = (S.wrongTopics[p.topic]||0)+1;
    $("#h-stage-box").classList.add("shake");
    setTimeout(()=>$("#h-stage-box").classList.remove("shake"),320);
  }
  paintHP();
  $("#h-score").textContent = S.score;

  const last = S.i === S.list.length-1;
  const dead = S.hp <= 0;
  $("#h-verdict").innerHTML = `
    <div class="verdict ${ok?"good":"bad"}">
      <h3>${ok?"命中　"+(100+ (S.hp)*20)+" pts":"はずれ　残機 −1"}</h3>
      <dl>
        <dt>バグの正体</dt>
        <dd>${p.lines[p.bug].trim()}</dd>
        <dt>なぜ問題か</dt>
        <dd>${p.why}</dd>
        <dt>修正</dt>
        <dd><pre>${esc(p.fix)}</pre></dd>
      </dl>
      <div class="next">
        <button class="btn" id="h-next">${dead?"結果を見る":(last?"結果を見る":"次のコードへ　▶")}</button>
      </div>
    </div>`;
  $("#h-next").focus();
  $("#h-next").addEventListener("click",()=>{
    if(dead || last) finish();
    else { S.i++; drawHunt(); }
  });
}


/* ═══════════════════════════════════════════
   タイムアタック
   ═══════════════════════════════════════════ */
const LIMIT = 90;

function startTime(){
  mode = "time";
  S = { list:shuffle(QUIZ), i:0, score:0, combo:0, maxCombo:0,
        correct:0, answered:0, wrongTopics:{}, left:LIMIT, locked:false };
  show("#s-time");
  drawQ();
  S.timer = setInterval(tick,1000);
  paintTimer();
}

function tick(){
  S.left--;
  paintTimer();
  if(S.left<=0){ clearInterval(S.timer); finish(); }
}

function paintTimer(){
  $("#t-time").textContent = S.left;
  const f = $("#t-fill");
  f.style.width = (S.left/LIMIT*100)+"%";
  f.className = "timer-fill" + (S.left<=10?" crit":S.left<=25?" warn":"");
}

function mult(){ return S.combo>=10?4 : S.combo>=6?3 : S.combo>=3?2 : 1; }

function drawQ(){
  const q = S.list[S.i % S.list.length];
  S.locked = false;
  $("#t-topic").textContent = q.t;
  $("#t-q").innerHTML = esc(q.q).replace(/\n/g,"<br>");
  $("#t-choices").innerHTML = q.c.map((c,i)=>
    `<button class="choice${q.mono?"":" plain"}" data-i="${i}">
       <span class="key">${i+1}</span><span class="txt">${esc(c)}</span></button>`).join("");
  $$("#t-choices .choice").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.i)));
}

function answer(i){
  if(S.locked) return;
  S.locked = true;
  const q = S.list[S.i % S.list.length];
  const btns = $$("#t-choices .choice");
  btns.forEach(b=>b.disabled=true);
  S.answered++;

  if(i===q.a){
    btns[i].classList.add("right");
    S.combo++;
    S.maxCombo = Math.max(S.maxCombo,S.combo);
    S.correct++;
    const gain = 100*mult();
    S.score += gain;
    if(S.combo>=3) popCombo(S.combo+" COMBO");
  }else{
    btns[i].classList.add("wrong");
    btns[q.a].classList.add("right");
    S.combo = 0;
    S.left = Math.max(0,S.left-3);   /* 誤答は3秒ペナルティ */
    S.wrongTopics[q.t] = (S.wrongTopics[q.t]||0)+1;
    paintTimer();
  }

  $("#t-score").textContent = S.score;
  $("#t-combo").textContent = "×"+mult();

  const wait = i===q.a ? 550 : 2300;
  if(i!==q.a){
    $("#t-choices").insertAdjacentHTML("beforeend",
      `<p style="font-size:13px;color:var(--slate);padding:6px 2px;line-height:1.7">${esc(q.e)}　<span style="color:var(--coral)">−3秒</span></p>`);
  }
  setTimeout(()=>{
    if(S.left<=0) return;
    S.i++;
    drawQ();
  },wait);
}

function popCombo(txt){
  const el = $("#combo-fx");
  el.textContent = txt;
  el.classList.remove("pop");
  void el.offsetWidth;
  el.classList.add("pop");
}


/* ═══════════════════════════════════════════
   リザルト
   ═══════════════════════════════════════════ */
const GUIDE = {
  "構造体":"総まとめ復習ノート 第1章（char配列と strcpy／. と ->）",
  "動的メモリ":"パターン写経シート 型①（malloc 4点セット）",
  "ファイル操作":"総まとめ復習ノート 第3章（最重要）",
  "ファイル書き込み":"パターン写経シート 型③（fopen→fprintf→fclose）",
  "ファイル読み込み":"パターン写経シート 型②（fgets＋sscanf）",
  "GitHub":"総まとめ復習ノート 第4章（Fork/clone/PR）"
};

function finish(){
  if(S.timer) clearInterval(S.timer);

  const isHunt = mode==="hunt";
  const score = S.score;
  const newBest = score > best[mode];
  if(newBest){ best[mode] = score; saveBest(); paintBest(); }

  const acc = isHunt
    ? (S.i+1>0 ? Math.round(S.cleared/(S.i+1)*100) : 0)
    : (S.answered>0 ? Math.round(S.correct/S.answered*100) : 0);

  const rank = acc>=95?"S" : acc>=80?"A" : acc>=60?"B" : "C";
  const rk = $("#r-rank");
  rk.textContent = rank;
  rk.className = "rank " + (rank==="S"?"s":rank==="C"?"c":"");

  $("#r-mode").textContent = isHunt ? "BUG HUNTER" : "TIME ATTACK";
  $("#r-score").textContent = score.toLocaleString()+" pts";
  $("#r-newbest").classList.toggle("hidden",!newBest);

  $("#r-stats").innerHTML = isHunt ? `
    <div class="stat"><span>撃ち抜いた</span><b>${S.cleared} / ${S.i+1}</b></div>
    <div class="stat"><span>命中率</span><b>${acc}%</b></div>
    <div class="stat"><span>残機</span><b>${Math.max(0,S.hp)}</b></div>
    <div class="stat"><span>ベスト</span><b>${best.hunt}</b></div>` : `
    <div class="stat"><span>正解</span><b>${S.correct} / ${S.answered}</b></div>
    <div class="stat"><span>正答率</span><b>${acc}%</b></div>
    <div class="stat"><span>最大コンボ</span><b>${S.maxCombo}</b></div>
    <div class="stat"><span>ベスト</span><b>${best.time}</b></div>`;

  const weak = Object.entries(S.wrongTopics).sort((a,b)=>b[1]-a[1]);
  $("#r-weak").innerHTML = weak.length ? `
    <div class="weak">
      <h3>取りこぼしたトピック</h3>
      <ul>${weak.map(([t,n])=>`<li>${t}　${n}問　→　${GUIDE[t]||""}</li>`).join("")}</ul>
      <p class="tip">同じトピックで2問以上落としていたら、そこが弱点です。該当の資料を読み直してから、もう一度。</p>
    </div>` : `
    <div class="weak" style="box-shadow:0 0 0 4px var(--lime)">
      <h3 style="color:var(--lime)">取りこぼしなし</h3>
      <p class="tip">全問正解です。模擬試験Aを60分・参照なしで通しで解いてみてください。</p>
    </div>`;

  show("#s-result");
}


/* ═══════════════════════════════════════════
   操作
   ═══════════════════════════════════════════ */
$$(".mode-card").forEach(b=>b.addEventListener("click",()=>{
  b.dataset.mode==="hunt" ? startHunt() : startTime();
}));

document.addEventListener("click",e=>{
  const act = e.target.dataset && e.target.dataset.act;
  if(act==="quit"){ if(S.timer) clearInterval(S.timer); show("#s-title"); }
  if(act==="home"){ show("#s-title"); }
  if(act==="retry"){ mode==="hunt" ? startHunt() : startTime(); }
});

document.addEventListener("keydown",e=>{
  if(!$("#s-time").classList.contains("hidden") && /^[1-4]$/.test(e.key)){
    const b = $$("#t-choices .choice")[+e.key-1];
    if(b && !b.disabled) b.click();
  }
  if(!$("#s-hunt").classList.contains("hidden") && e.key==="Enter"){
    const n = $("#h-next"); if(n) n.click();
  }
});

loadBest();
</script>
